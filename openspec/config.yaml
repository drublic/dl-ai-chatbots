schema: spec-driven

context: |
  Workshop: DL School B07/26 · Module 4 · Session 4 — Implementing AI Features & Chatbots.
  Product: Race-season assistant — a chatbot attendees wire themselves (OpenAI classify +
  shared Postgres season data + streaming UI).

  Teaching point: composition → product. Prior sessions (automation, context, MCP · RAG)
  set the mindset; tonight’s live path is classify → SQL → stream. MCP wrap of query
  helpers is optional homework, not a live build step.

  Build path (majority of session time) — five companion checkpoints (not greenfield create-next-app):
  1. Start development (run companion: env, seed, hub)
  2. Initial chat interface (UI shell + useChat)
  3. Wire model streaming (/api/chat + visible states)
  4. Classify the question, then query Postgres (experimental_decide → lib/queries)
  5. Query with golden questions + refusal in the browser

  Short theory: streaming, UI/error states, chat anatomy, how pieces click together.
  OpenSpec change name in the companion: build-race-season-assistant.

  This OpenSpec root lives in the Reveal deck repo (`dl-ai-chatbots`) as a planning mirror.
  Canonical apply target: https://github.com/drublic/dl-school-chatbots
  (local: ../dl-school-chatbots) — attendees open OpenSpec there.

  Stack:
  - Next.js App Router + TypeScript + Tailwind
  - Vercel AI SDK: `ai`, `@ai-sdk/openai`, `@ai-sdk/react`
  - Client: `useChat` + `DefaultChatTransport` → `/api/chat`
  - Server: `streamText`, UI message stream; classify via `experimental_decide` + `choice`
  - Season facts from shared Postgres (`lib/queries`); not model memory
  - Env: OPENAI_API_KEY, OPENAI_MODEL, DATABASE_URL
  - Optional homework: MCP wrap of the same query helpers; deploy

rules:
  proposal:
    - "Keep one change for the whole MVP; prefer a single capability"
    - "Frame as race-season classify → SQL → stream; MCP/RAG are prior-session or homework"
    - "Always include Non-goals covering homework and slide-deck work"
  design:
    - "Build order must match workshop steps: companion → UI → wire → classify+SQL → query"
    - "Prefer AI SDK Decisions + Postgres; do not require handbook MCP or Pinecone for the live path"
  tasks:
    - "Order tasks to match the five build steps; theory is out of scope for apply"
    - "Each task should be verifiable locally without Vercel deploy"

operations:
  apply:
    guidance:
      - "Implement in the dl-school-chatbots companion repo; do not modify Reveal slide HTML unless a task says so"
      - "Keep secrets in .env.local only; never commit keys"
